<mat-card>
  <mat-card-header>
    <mat-card-title>Mi perfil</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (usuario) {
      <p>Nombre: {{ usuario.nombre }} {{ usuario.apellido }}</p>
      <p>DNI: {{ usuario.dni }}</p>
      <p>Email: {{ usuario.email }}</p>
      <p>Rol: {{ usuario.rol }}</p>
    } @else {
      <p>Cargando...</p>
    }
  </mat-card-content>
</mat-card>
