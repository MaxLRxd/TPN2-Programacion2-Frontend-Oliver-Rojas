<mat-toolbar color="primary">
  <span>Clínica Virtual</span>
  <span style="flex: 1 1 auto"></span>
  @if (!auth.isLoggedIn()) {
    <span>Bienvenido a la clínica virtual</span>
  } @else {
    <span>{{ nombre }}</span>
    <button mat-icon-button [matMenuTriggerFor]="infoMenu" aria-label="Información de usuario">
      <mat-icon>info</mat-icon>
    </button>
    <mat-menu #infoMenu="matMenu">
      <span mat-menu-item disabled>Tipo: {{ tipo }}</span>
      <button mat-menu-item (click)="logout()">Cerrar sesión</button>
    </mat-menu>
    <button mat-icon-button aria-label="Notificaciones">
      <mat-icon>notifications</mat-icon>
    </button>
  }
</mat-toolbar>
