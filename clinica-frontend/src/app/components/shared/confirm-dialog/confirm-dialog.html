<h2 mat-dialog-title>
  @if (datos.icono) {
    <mat-icon aria-hidden="true">{{ datos.icono }}</mat-icon>
  }
  {{ datos.titulo }}
</h2>

<mat-dialog-content>
  <p>{{ datos.mensaje }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancelar()">
    {{ datos.textoCancelar || 'Cancelar' }}
  </button>
  <button mat-flat-button [color]="datos.color || 'primary'" type="button" (click)="confirmar()">
    {{ datos.textoConfirmar || 'Confirmar' }}
  </button>
</mat-dialog-actions>
